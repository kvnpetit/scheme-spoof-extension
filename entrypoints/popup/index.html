<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SchemeSpoof</title>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
      <symbol id="i-system" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="13" rx="2" />
        <path d="M8 21h8m-4-4v4" />
      </symbol>
      <symbol id="i-light" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
      </symbol>
      <symbol id="i-dark" viewBox="0 0 24 24">
        <path d="M20.6 15A9 9 0 0 1 9 3.4 9 9 0 1 0 20.6 15Z" />
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <ellipse cx="12" cy="12" rx="4" ry="9" />
        <path d="M3 12h18" />
      </symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="3" />
        <path d="m7 9 3 3-3 3m6 0h4" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 11a8 8 0 0 0-14-4l-2 2m0-5v5h5m-5 4a8 8 0 0 0 14 4l2-2m0 5v-5h-5" />
      </symbol>
    </svg>

    <header class="header">
      <img src="/icon/logo.svg" width="48" height="48" alt="" />
      <div class="brand">
        <h1>SchemeSpoof</h1>
        <div class="domain">
          <svg class="icon" aria-hidden="true"><use href="#i-globe" /></svg>
          <span id="domain">Finding current site…</span>
        </div>
      </div>
    </header>

    <main>
      <section class="card" aria-labelledby="tab-heading">
        <div class="card-header">
          <h2 id="tab-heading">Theme for this tab</h2>
        </div>
        <fieldset id="tab-controls" class="segments" aria-labelledby="tab-heading" disabled>
          <button type="button" data-scheme="system" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-system" /></svg>
            System
          </button>
          <button type="button" data-scheme="light" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-light" /></svg>
            Light
          </button>
          <button type="button" data-scheme="dark" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-dark" /></svg>
            Dark
          </button>
        </fieldset>
        <div id="shortcut" hidden>
          <div class="shortcut-row">
            <p class="note">Toggle light and dark <kbd id="shortcut-key"></kbd></p>
            <button id="edit-shortcut" class="icon-button" type="button" hidden>
              Edit shortcut
            </button>
          </div>
          <form id="shortcut-editor" hidden>
            <label for="shortcut-input">New shortcut</label>
            <div class="shortcut-row">
              <input
                id="shortcut-input"
                placeholder="Ctrl+Shift+Space"
                aria-describedby="shortcut-hint"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
              />
              <button class="icon-button" type="submit">Save</button>
            </div>
            <p id="shortcut-hint" class="note">Leave empty to disable the shortcut.</p>
          </form>
          <p id="shortcut-status" class="note" role="status"></p>
        </div>
      </section>

      <section id="diagnostics" class="card" aria-labelledby="diagnostic-heading">
        <div class="card-header">
          <h2 id="diagnostic-heading">
            <svg class="icon" aria-hidden="true"><use href="#i-terminal" /></svg>Page diagnostics
          </h2>
          <button
            id="refresh-diagnostics"
            class="icon-button"
            type="button"
            aria-label="Refresh diagnostics"
            disabled
          >
            <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>Refresh
          </button>
        </div>
        <p id="diagnostic-status" class="note" role="status"></p>
        <dl id="diagnostic-values" hidden>
          <div>
            <dt>Requested theme</dt>
            <dd id="requested"></dd>
          </div>
          <div>
            <dt><code>matchMedia</code></dt>
            <dd id="observed"></dd>
          </div>
          <div>
            <dt>Rewritten media conditions</dt>
            <dd id="rewritten"></dd>
          </div>
          <div>
            <dt>Unreadable stylesheets</dt>
            <dd id="inaccessible"></dd>
          </div>
        </dl>
      </section>

      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
